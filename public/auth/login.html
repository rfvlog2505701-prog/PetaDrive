<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#6366f1" />
<title>Sign in — PetaDrive</title>
<link rel="icon" href="/assets/logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/base.css" />
<link rel="stylesheet" href="/assets/css/auth.css" />
</head>
<body class="auth-body">
<div class="auth-wrap">
  <div class="auth-art">
    <div class="brand"><img src="/assets/logo.jpg" alt=""><span>PetaDrive</span></div>
    <div>
      <h1>Your Files.<br>Your Cloud.<br>Your Way.</h1>
      <p>One secure place for every file — upload, organize and share with links that live on your own domain.</p>
    </div>
    <span class="muted small">&copy; <span id="yearNow"></span> PetaDrive</span>
  </div>
  <div class="auth-form-wrap">
    <form class="auth-form" id="loginForm">
      <div class="brand" style="margin-bottom:10px"><img src="/assets/logo.jpg" alt=""><span>PetaDrive</span></div>
      <h2>Welcome back</h2>
      <p class="sub">Sign in to your cloud.</p>
      <div class="err-box hidden" id="errBox"></div>
      <div class="field"><label>Email</label><input id="loginEmail" type="email" required autocomplete="email" /></div>
      <div class="field"><label>Password</label><input id="loginPass" type="password" required autocomplete="current-password" /></div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
      <div class="hidden" id="resendWrap" style="margin-top:12px;text-align:center"><button type="button" class="btn btn-plain btn-sm" id="resendBtn">Resend verification email</button></div>
      <div style="text-align:center;margin-top:10px"><button type="button" class="btn btn-plain btn-sm" id="forgotBtn">Forgot password?</button></div>
      <p class="auth-switch">New to PetaDrive? <a href="/auth/register.html">Create an account</a></p>
    </form>
  </div>
</div>
<div class="toast-host" id="toastHost"></div>
<script type="module">
  import { wireLoginForm } from '/assets/js/auth.js';
  wireLoginForm();
  document.getElementById('yearNow').textContent = new Date().getFullYear();
</script>
</body>
</html>
