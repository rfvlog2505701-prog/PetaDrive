<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#6366f1" />
<title>Create account — PetaDrive</title>
<link rel="icon" href="/assets/logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/base.css" />
<link rel="stylesheet" href="/assets/css/auth.css" />
</head>
<body class="auth-body">
<div class="auth-wrap">
  <div class="auth-art">
    <div class="brand"><img src="/assets/logo.jpg" alt=""><span>PetaDrive</span></div>
    <div>
      <h1>Create your<br>free cloud<br>account.</h1>
      <p>10 GB free storage, secure token-protected uploads, and shareable download pages on your own domain.</p>
    </div>
    <span class="muted small">&copy; <span id="yearNow"></span> PetaDrive</span>
  </div>
  <div class="auth-form-wrap">
    <form class="auth-form" id="registerForm">
      <div class="brand" style="margin-bottom:10px"><img src="/assets/logo.jpg" alt=""><span>PetaDrive</span></div>
      <h2>Create account</h2>
      <p class="sub">Start storing and sharing in minutes.</p>
      <div class="err-box hidden" id="errBox"></div>
      <div class="field"><label>Full name</label><input id="regName" type="text" required autocomplete="name" /></div>
      <div class="field"><label>Email</label><input id="regEmail" type="email" required autocomplete="email" /></div>
      <div class="field"><label>Password</label><input id="regPass" type="password" minlength="8" required autocomplete="new-password" /></div>
      <div class="field"><label>Confirm password</label><input id="regConfirm" type="password" minlength="8" required autocomplete="new-password" /></div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center">Create account</button>
      <p class="auth-switch">Already have an account? <a href="/auth/login.html">Sign in</a></p>
    </form>
  </div>
</div>
<div class="toast-host" id="toastHost"></div>
<script type="module">
  import { wireRegisterForm } from '/assets/js/auth.js';
  wireRegisterForm();
  document.getElementById('yearNow').textContent = new Date().getFullYear();
</script>
</body>
</html>
