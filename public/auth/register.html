<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#6366f1" />
<title>Create account — PetaDrive</title>
<link rel="icon" href="/assets/logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/base.css" />
<link rel="stylesheet" href="/assets/css/auth.css" />
</head>
<body class="auth-body">
<canvas id="auth-canvas"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="auth-wrap">
  <div class="auth-art">
    <div class="brand">
      <img src="/assets/logo.jpg" alt="" />
      <span>PetaDrive</span>
    </div>
    <div>
      <div class="art-icons">
        <div class="art-icon">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        </div>
        <div class="art-icon" style="color:var(--p2)">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>
        </div>
        <div class="art-icon" style="color:var(--p3)">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v6h5M9 14h7M9 17h5"/></svg>
        </div>
        <div class="art-icon" style="color:#10b981">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 8 6-16 2 8h4"/></svg>
        </div>
      </div>
      <h1>Create your<br>free cloud<br>account.</h1>
      <p>10 GB free storage, secure token-protected uploads, and shareable download pages on your own domain.</p>
    </div>
    <span class="muted small">&copy; <span id="yearNow"></span> PetaDrive</span>
  </div>

  <div class="auth-form-wrap">
    <form class="auth-form" id="registerForm" autocomplete="on">
      <div class="brand" style="margin-bottom:4px">
        <img src="/assets/logo.jpg" alt="" />
        <span>PetaDrive</span>
      </div>
      <h2>Create account</h2>
      <p class="sub">Start storing and sharing in minutes.</p>
      <div class="err-box hidden" id="errBox"></div>
      <div class="field">
        <label for="regName">Full name</label>
        <input id="regName" type="text" required autocomplete="name" placeholder="Your name" />
      </div>
      <div class="field">
        <label for="regEmail">Email</label>
        <input id="regEmail" type="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="regPass">Password</label>
        <input id="regPass" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters" />
      </div>
      <div class="field">
        <label for="regConfirm">Confirm password</label>
        <input id="regConfirm" type="password" minlength="8" required autocomplete="new-password" placeholder="Repeat password" />
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:4px">
        <svg class="ico ico-anim" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Create account
      </button>
      <p class="auth-switch">Already have an account? <a href="/auth/login.html">Sign in</a></p>
    </form>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>
<script type="module">
  import { wireRegisterForm } from '/assets/js/auth.js';
  import { startParticles, initTheme } from '/assets/js/ui.js';
  initTheme();
  startParticles('auth-canvas');
  wireRegisterForm();
  document.getElementById('yearNow').textContent = new Date().getFullYear();
</script>
</body>
</html>
